name: SuperEnfermagem
options:
  bundleIdPrefix: br.com.mariaamelia
  deploymentTarget:
    iOS: "15.0"
targets:
  SuperEnfermagem:
    type: application
    platform: iOS
    sources:
      - path: SuperEnfermagemApp.swift
      - path: Assets.xcassets
      - path: Resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.mariaamelia.superenfermagem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
